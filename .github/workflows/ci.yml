name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      - name: Run Python tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          poetry run python -m pytest \
            --cov=robin \
            --cov=mlops \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage-python.xml

      - name: Upload Python coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-python.xml
          flags: python-robin-mlops
          name: python-robin-mlops-coverage

  test-dashboard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - frontend: robin-dashboard
            frontend_label: robin-dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.frontend }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.frontend }}
        run: npm ci

      - name: Run dashboard unit tests with coverage
        working-directory: ${{ matrix.frontend }}
        run: npm run coverage

      - name: Upload dashboard unit coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.frontend }}/coverage/lcov.info
          flags: dashboard-unit
          name: dashboard-unit-coverage-${{ matrix.frontend_label }}

      - name: Build dashboard
        working-directory: ${{ matrix.frontend }}
        run: npm run build
