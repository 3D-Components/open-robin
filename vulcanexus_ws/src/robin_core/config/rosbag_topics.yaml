# Topics to record during a weld experiment.
# Used by experiment_record.launch.py to build the ros2 bag record command.
#
# Organised by subsystem so you can easily comment out groups.
# The launch file reads the 'topics' list and passes it to ros2 bag record.

rosbag_topics:
  # -- Processed weld data (progression-tagged) --
  - /robin/data/progression          # WeldProgression  (bead_id + normalised arc-length)
  - /robin/data/fronius              # WelderData       (current/voltage/wfs/power + progression)
  - /robin/data/active_bead          # ActiveBead        (bead path + target params)
  - /robin/data/is_welding           # Bool              (arc on/off)

  # -- Raw Fronius measurements --
  - /fronius/display_current         # Float32 (A)
  - /fronius/display_voltage         # Float32 (V)
  - /fronius/display_wfs             # Float32 (m/min)
  - /fronius/display_power           # Float32 (W)

  # -- Robot state --
  - /joint_states                    # sensor_msgs/JointState
  - /tf                              # tf2_msgs/TFMessage  (for TCP reconstruction)
  - /tf_static                       # tf2_msgs/TFMessage  (URDF static frames)

  # -- Sensor data (can be large — comment out if not needed) --
  - /robin/pointcloud                # sensor_msgs/PointCloud2 (Garmo profilometer)
  - /robin/weld_dimensions           # processed profile dimensions

  # -- Experiment lifecycle --
  - /weld_experiment/_action/feedback        # WeldExperiment action feedback
  - /weld_experiment/_action/status          # GoalStatusArray
  - /execute_bead/_action/feedback           # ExecuteBead action feedback
  - /execute_bead/_action/status             # GoalStatusArray
